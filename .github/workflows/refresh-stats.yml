name: Refresh language panel

# The language panel is generated rather than fetched from a third-party widget,
# so it needs a scheduled rebuild to stay current.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh-stats.yml"

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet fonttools

      - name: Rebuild language panel
        working-directory: scripts
        env:
          # Needs repo scope to include private repositories in the totals.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: python build_langs.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh language panel"
          git push
